<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      height: 200px;
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      transition: background-color 0.3s ease;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 20px;
    }
    
    button {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    
    button:hover {
      background-color: #45a049;
    }
    
    button:active {
      background-color: #3d8b40;
    }
    
    #resultText {
      width: 200px;
      height: 40px;
      padding: 10px;
      font-size: 14px;
      text-align: center;
      border: 2px solid #ddd;
      border-radius: 4px;
      background-color: white;
      resize: none;
      outline: none;
    }
    
    #resultText:focus {
      border-color: #4CAF50;
    }
  </style>
</head>
<body>
  <div class="container">
    <button id="generateBtn">Generate Random</button>
    <textarea id="resultText" readonly placeholder="Click the button to generate random values..."></textarea>
  </div>
  <script src="popup.js"></script>
</body>
</html>
